name: Build Android APK and test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'score-utils.js'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'tests/**'
      - 'playwright.config.js'
      - 'e2e/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'failure')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p web/assets
          cp index.html app.js styles.css score-utils.js web/
          cp assets/icon.svg web/assets/
          cp node_modules/@techstark/opencv-js/dist/opencv.js web/assets/opencv.js
          find node_modules/@techstark/opencv-js -type f -name '*.wasm' -exec cp {} web/assets/ \;
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check score-utils.js
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: domino-score-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
